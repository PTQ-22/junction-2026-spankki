[project]
name = "taimi"
version = "0.1.0"
description = "Taimi - S-Pankki personal economic trainer (Junction 2026)"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.6.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.7",
    "google-genai==3.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
