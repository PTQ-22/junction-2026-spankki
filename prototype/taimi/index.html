<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Taimi — a money garden coach inside S-mobiili. Junction 2026 / S-Pankki prototype." />
  <title>Taimi – money garden coach</title>

  <!-- Anti-FOUC: apply .dark before first paint.
       Default is light; dark only via ?theme=dark or localStorage.theme === "dark". -->
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      var dark =
        t === "dark" || (t !== "light" && localStorage.theme === "dark");
      if (dark) document.documentElement.classList.add("dark");
    })();
  </script>

  <!--
    Taimi v2 — the garden as a calm Nordic landscape. Single-file prototype:
    persona data inlined verbatim from ./persona-data.json (frozen 2026-09-15),
    all art inline SVG, interactions vanilla JS.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- shadcn / tweakcn token contract — S-Pankki palette -->
  <style type="text/tailwindcss">
    @custom-variant dark (&:is(.dark *));

    :root {
      --background: #F5F8F7; --foreground: #1F1F1F;
      --card: #FFFFFF; --card-foreground: #1F1F1F;
      --popover: #FFFFFF; --popover-foreground: #1F1F1F;
      --primary: #007841; --primary-foreground: #FFFFFF;
      --secondary: #E4EEE9; --secondary-foreground: #004628;
      --muted: #E9F0ED; --muted-foreground: #666666;
      --accent: #E3F6EA; --accent-foreground: #004628;
      --destructive: #B70000; --destructive-foreground: #FFFFFF;
      --border: #E6E6E6; --input: #E6E6E6;
      --ring: #007841;
      --radius: 0.625rem;
      --shadow-sm: 0 1px 3px rgb(0 0 0 / .06);
    }
    .dark {
      --background: #0F1513; --foreground: #E9F1ED;
      --card: #16211D; --card-foreground: #E9F1ED;
      --popover: #16211D; --popover-foreground: #E9F1ED;
      --primary: #3CC176; --primary-foreground: #062015;
      --secondary: #1E2C25; --secondary-foreground: #BFE9CF;
      --muted: #1A2621; --muted-foreground: #93A89D;
      --accent: #1E3A2C; --accent-foreground: #BFE9CF;
      --border: #26362F; --input: #26362F;
      --ring: #3CC176;
    }
    @theme inline {
      --color-background: var(--background); --color-foreground: var(--foreground);
      --color-card: var(--card); --color-card-foreground: var(--card-foreground);
      --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent); --color-accent-foreground: var(--accent-foreground);
      --color-border: var(--border); --color-input: var(--input); --color-ring: var(--ring);
      --font-sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
    }
    @layer base {
      *, *::before, *::after { box-sizing:border-box; }
      * { @apply border-border outline-ring/50; }
      body { @apply bg-background text-foreground font-sans antialiased; }
    }

    /* ================= page chrome ================= */
    html, body { overflow-x:hidden; }
    .seg { display:inline-flex; flex-wrap:wrap; gap:2px; max-width:100%; background:var(--muted); border:1px solid var(--border); border-radius:999px; padding:3px; }
    .seg > button { border:0; background:transparent; color:var(--muted-foreground); font:inherit; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; min-width:0; }
    .seg > button:hover { color:var(--foreground); }
    .seg > button[aria-pressed="true"] { background:var(--card); color:var(--foreground); box-shadow:var(--shadow-sm); }
    .seg > button:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
    @media (max-width:700px) { .seg { display:flex; width:100%; border-radius:16px; } .seg > button { white-space:normal; line-height:1.15; flex:1 1 30%; text-align:center; } }

    .devices { display:flex; gap:28px; overflow-x:auto; padding:10px 4px 26px; scroll-snap-type:x proximity; }
    .device { flex:0 0 auto; scroll-snap-align:start; }
    .bezel { width:390px; padding:10px; border-radius:52px; background:#101410; box-shadow:0 24px 60px -24px rgb(0 0 0/.45); }
    .screen { width:370px; height:804px; border-radius:42px; overflow:hidden; position:relative; }
    @media (min-width:1200px) and (max-width:1699px) { .devices { flex-wrap:wrap; overflow:visible; scroll-snap-type:none; justify-content:center; } }
    @media (min-width:1700px) { .devices { zoom:.8; } }
    @media (max-width:700px) {
      .devices { flex-direction:column; overflow:visible; gap:40px; padding:0; }
      .device { width:100%; }
      .bezel { padding:0; border-radius:0; background:none; box-shadow:none; width:auto; }
      .screen { width:100%; height:auto; min-height:640px; border-radius:0; overflow:visible; }
      .app { overflow:visible !important; }
    }

    /* ================= shared screen chrome ================= */
    .app { height:100%; overflow-y:auto; scrollbar-width:none; display:flex; flex-direction:column; }
    .app::-webkit-scrollbar { display:none; }
    .statusbar { height:44px; display:flex; align-items:center; justify-content:space-between; padding:4px 26px 0; font-weight:700; font-size:14px; flex:0 0 auto; }
    .statusbar.overlay { position:absolute; top:0; left:0; right:0; z-index:9; color:#F4F6F8; }
    .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,18px); background:var(--toast-bg,#1F1F1F); color:var(--toast-ink,#fff); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:60; max-width:min(90vw,420px); text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .rng { flex:1; accent-color:var(--primary); min-width:0; }
    [hidden] { display:none !important; }

    /* ================= Taimi app ================= */
    .tg-app {
      --ink:#1F2A24; --sub:#5E6E63; --faint:#8A9A8E;
      --panel:#FFFFFF; --line:#E4EAE2;
      --sage:#E4EEE4; --sageink:#3E5C44;
      --green:#007841; --tint:#E3F6EA;
      background:#F4F7F3; color:var(--ink); font-family:"Figtree",ui-sans-serif,system-ui,sans-serif;
    }
    .dark .tg-app {
      --ink:#E9F1ED; --sub:#93A89D; --faint:#6E8479;
      --panel:#16211D; --line:#26362F;
      --sage:#1E2C25; --sageink:#BFE9CF;
      --tint:#1E3A2C;
      background:#0F1513;
    }
    .tg-scene { position:relative; flex:1; min-height:0; overflow:hidden; }
    .tg-art { position:absolute; inset:0; }
    .tg-art > svg { display:block; width:100%; height:100%; }

    /* top bar: Taimi + stage dots + avatar */
    .tg-topbar { position:absolute; top:46px; left:12px; right:12px; z-index:6;
      background:rgb(255 255 255/.78); backdrop-filter:blur(8px); border:1px solid rgb(255 255 255/.65);
      border-radius:16px; padding:9px 12px; display:flex; align-items:center; gap:10px; }
    .dark .tg-topbar { background:rgb(22 33 29/.78); border-color:rgb(255 255 255/.12); }
    .tg-topbar .nm { font-weight:700; font-size:14.5px; }
    .tg-topbar .stg { font-weight:600; font-size:11px; color:var(--sub); margin-left:2px; }
    .tg-dots { display:inline-flex; gap:4px; margin-left:8px; }
    .tg-dots i { width:6px; height:6px; border-radius:50%; background:rgb(0 0 0/.14); }
    .tg-dots i.on { background:var(--green); }
    .dark .tg-dots i { background:rgb(255 255 255/.18); }
    .dark .tg-dots i.on { background:var(--primary); }
    .tg-ava { margin-left:auto; width:28px; height:28px; border-radius:50%; background:var(--sage); color:var(--sageink); display:grid; place-items:center; font-weight:700; font-size:12px; }

    /* the one number on the sky */
    .tg-num { position:absolute; top:138px; left:0; right:0; z-index:6; text-align:center; color:#1F2A24; }
    .tg-num.storm { color:#EDF2F0; }
    .tg-num .big { font-weight:800; font-size:44px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; }
    .tg-num .sub { font-weight:600; font-size:12.5px; margin-top:6px; opacity:.82; font-variant-numeric:tabular-nums; }

    /* bottom cards + tab bar */
    .tg-cards { position:absolute; left:14px; right:14px; bottom:92px; z-index:6; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .tg-card-btn { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; font:inherit; font-weight:700; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left; }
    .tg-card-btn svg { color:var(--green); flex:0 0 auto; }
    .dark .tg-card-btn svg { color:var(--primary); }
    .tg-card-btn:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
    .tg-attn { position:absolute; top:11px; right:11px; width:7px; height:7px; border-radius:50%; background:var(--sageink); opacity:.85; }
    .tg-tabs { position:absolute; left:0; right:0; bottom:0; z-index:7; background:var(--panel); border-top:1px solid var(--line); padding:8px 10px 20px; display:flex; }
    .tg-tab { flex:1; border:0; background:transparent; font:inherit; font-weight:600; font-size:10.5px; color:var(--faint); display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0; cursor:pointer; }
    .tg-tab.on { color:var(--green); }
    .dark .tg-tab.on { color:var(--primary); }
    .tg-tab:focus-visible { outline:2px solid var(--ring); border-radius:8px; }

    /* flower sheet */
    .tg-callout { position:absolute; z-index:6; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 13px; font-weight:600; font-size:12.5px; line-height:1.45; max-width:236px; }
    .tg-callout::after { content:""; position:absolute; bottom:-7px; left:32px; border:8px solid transparent; border-top-color:var(--panel); border-bottom:0; border-left-width:6px; border-right-width:6px; }
    .tg-sheet { position:absolute; left:0; right:0; bottom:0; z-index:8; height:45%; overflow-y:auto; scrollbar-width:none; background:var(--panel); border-radius:20px 20px 0 0; padding:12px 20px 20px; box-shadow:0 -8px 24px rgb(0 0 0/.10); }
    .tg-sheet::-webkit-scrollbar { display:none; }
    .tg-grab { width:40px; height:4px; border-radius:2px; background:rgb(0 0 0/.14); margin:0 auto 12px; }
    .dark .tg-grab { background:rgb(255 255 255/.2); }
    .tg-sheet h3 { margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em; }
    .tg-pill { display:inline-block; background:var(--sage); color:var(--sageink); font-weight:700; font-size:11px; padding:4px 10px; border-radius:999px; margin:8px 0 12px; }
    .tg-bignum { display:flex; align-items:baseline; gap:12px; font-variant-numeric:tabular-nums; }
    .tg-bignum .a { font-size:30px; font-weight:800; letter-spacing:-.02em; }
    .tg-bignum .vs { font-size:12px; font-weight:600; color:var(--sub); }
    .tg-cmp { margin:10px 0 4px; }
    .tg-cmp .row { display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; color:var(--sub); margin-top:6px; }
    .tg-cmp .lbl { width:64px; flex:0 0 auto; }
    .tg-cmp .trk { flex:1; height:8px; border-radius:4px; background:var(--muted); overflow:hidden; }
    .tg-cmp .trk i { display:block; height:100%; border-radius:4px; }
    .tg-cmp .val { width:58px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
    .tg-eq { font-size:12.5px; font-weight:700; color:var(--ink); margin:10px 0 2px; font-variant-numeric:tabular-nums; }
    .tg-rows > div { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:12.5px; font-weight:600; }
    .tg-rows .d { color:var(--faint); width:86px; flex:0 0 auto; }
    .tg-rows .m { flex:1; min-width:0; }
    .tg-rows b { font-variant-numeric:tabular-nums; }
    .tg-disclose { margin-top:10px; }
    .tg-linkbtn { background:none; border:0; padding:0; font:inherit; font-size:12px; font-weight:700; color:var(--green); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
    .dark .tg-linkbtn { color:var(--primary); }
    .tg-evi { border-top:1px solid var(--line); margin-top:8px; }
    .tg-evi .r { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12px; font-weight:600; }
    .tg-evi .r b { font-variant-numeric:tabular-nums; }
    .tg-evi pre { font-family:"Geist Mono",ui-monospace,monospace; font-size:10.5px; line-height:1.5; color:var(--sub); background:var(--muted); border-radius:10px; padding:10px; margin:10px 0 0; white-space:pre-wrap; }

    /* decide */
    .tg-body { flex:1; overflow-y:auto; scrollbar-width:none; padding:12px 16px 100px; }
    .tg-body::-webkit-scrollbar { display:none; }
    .tg-h { font-size:17px; font-weight:800; letter-spacing:-.01em; margin:2px 0 2px; }
    .tg-sub { font-size:12px; font-weight:600; color:var(--sub); margin-bottom:12px; }
    .tg-seg { display:flex; background:var(--muted); border-radius:12px; padding:3px; gap:2px; }
    .tg-seg button { flex:1; border:0; background:transparent; font:inherit; font-size:12px; font-weight:700; color:var(--sub); padding:7px 4px; border-radius:9px; cursor:pointer; }
    .tg-seg button[aria-pressed="true"] { background:var(--panel); color:var(--ink); box-shadow:var(--shadow-sm); }
    .tg-slider-row { display:flex; align-items:center; gap:10px; margin:14px 0 4px; }
    .tg-cutval { font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; min-width:46px; text-align:right; }
    .tg-pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
    .tg-pcard { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 12px; position:relative; }
    .tg-pcard .pcl { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); }
    .tg-flw { display:grid; place-items:end center; height:142px; margin-top:4px; }
    .tg-pcard.fut .tg-flw svg { animation:tg-fade .35s ease; }
    @keyframes tg-fade { from { opacity:.35; transform:scale(.985); } to { opacity:1; transform:scale(1); } }
    .tg-gauge { margin-top:8px; }
    .tg-gauge .gl { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); }
    .tg-gauge .gtrk { height:10px; border-radius:5px; background:var(--muted); overflow:hidden; margin-top:4px; }
    .tg-gauge .gtrk i { display:block; height:100%; background:#7FA3B8; border-radius:5px; transition:width .35s ease; }
    .tg-gauge .gs { font-size:11px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
    .tg-stage { display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-size:11.5px; font-weight:700; }
    .tg-hint { font-size:11px; font-weight:600; color:var(--faint); margin-top:8px; }
    .tg-chart-note { font-size:11px; font-weight:600; color:var(--faint); text-align:center; padding-top:8px; }
    .tg-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tg-chip2 { background:var(--sage); color:var(--sageink); font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; }
    .tg-chip2.dim { opacity:.6; }
    .tg-seg button[disabled] { opacity:.45; cursor:not-allowed; }
    .tg-chart { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 14px 10px; margin-top:12px; }
    .tg-bars { display:flex; align-items:flex-end; gap:8px; height:110px; }
    .tg-bar-w { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; min-width:0; }
    .tg-bar-v { font-size:10px; font-weight:700; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .tg-bar { width:100%; max-width:34px; border-radius:5px 5px 0 0; background:var(--sage); transition:height .35s ease; }
    .tg-bar.hot { background:var(--green); }
    .dark .tg-bar.hot { background:var(--primary); }
    .tg-bar-m { font-size:10px; font-weight:600; color:var(--faint); }
    .tg-result { display:flex; align-items:baseline; justify-content:space-between; margin-top:14px; }
    .tg-result .t { font-size:34px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
    .tg-result .h { font-size:12.5px; font-weight:700; color:var(--sub); font-variant-numeric:tabular-nums; }
    .tg-note { font-size:11.5px; font-weight:600; color:var(--sub); margin-top:6px; }
    .tg-honest { font-size:11px; font-weight:500; color:var(--faint); margin-top:12px; line-height:1.5; }
    .tg-cta { display:block; width:100%; border:0; border-radius:14px; background:var(--green); color:#fff; font:inherit; font-weight:700; font-size:14px; padding:13px; margin-top:10px; cursor:pointer; }
    .tg-cta:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }

    /* ask */
    .tg-band { flex:0 0 28%; position:relative; overflow:hidden; min-height:170px; }
    .tg-chat { flex:1; overflow-y:auto; scrollbar-width:none; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
    .tg-chat::-webkit-scrollbar { display:none; }
    .tg-msg { max-width:84%; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 13px; font-size:13px; font-weight:500; line-height:1.5; }
    .tg-msg .who { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
    .tg-msg.me { align-self:flex-end; background:var(--tint); color:var(--accent-foreground); border-color:transparent; border-radius:14px 14px 4px 14px; }
    .tg-quick { padding:8px 14px 96px; display:flex; flex-wrap:wrap; gap:6px; }
    .tg-q { border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; font-size:11.5px; font-weight:600; padding:7px 11px; border-radius:999px; cursor:pointer; }
    .tg-q:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
    .tg-rec { margin-top:8px; padding-top:7px; border-top:1px dashed var(--line); }
    .tg-recbtn { background:none; border:0; padding:0; font:inherit; font-size:11.5px; font-weight:700; color:var(--green); cursor:pointer; }
    .dark .tg-recbtn { color:var(--primary); }

    /* widget mock */
    .ios { height:100%; min-height:640px; position:relative; display:flex; flex-direction:column; color:#F4F6F8; overflow:hidden; }
    .ios .wp { position:absolute; inset:0; }
    .ios .wp > svg { display:block; width:100%; height:100%; }
    .ios-grid { position:relative; z-index:2; display:grid; grid-template-columns:repeat(4,1fr); gap:14px 12px; padding:56px 16px 0; }
    .wgt { border-radius:18px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; min-height:76px; overflow:hidden; position:relative;
      background:rgb(255 255 255/.82); color:#1F2A24; border:1px solid rgb(255 255 255/.5); }
    .wgt.small { grid-column:span 2; grid-row:span 2; }
    .wgt.med { grid-column:span 4; min-height:150px; padding:0; }
    .wgt .w-nm { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#5E6E63; }
    .wgt .w-num { font-size:24px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
    .wgt .w-sub { font-size:10.5px; font-weight:600; color:#5E6E63; }
    .appico { aspect-ratio:1; border-radius:16px; background:rgb(255 255 255/.55); border:1px solid rgb(255 255 255/.35); display:grid; place-items:center; color:#3E4C42; }
    .ios-dock { margin-top:auto; position:relative; z-index:2; margin-left:12px; margin-right:12px; margin-bottom:22px; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; background:rgb(255 255 255/.28); border-radius:22px; padding:10px; backdrop-filter:blur(8px); }

    /* tap zones over flowers */
    .tg-tap { position:absolute; width:52px; height:80px; transform:translate(-50%,-80%); background:transparent; border:0; cursor:pointer; z-index:5; }
    .tg-tap:focus-visible { outline:2px solid var(--ring); outline-offset:2px; border-radius:12px; }

    .mg-rain { animation:mg-rain 1.1s linear infinite; }
    .mg-rain.r2 { animation-duration:1.6s; }
    @keyframes mg-rain { to { transform:translateY(7px); opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .mg-rain { animation:none; }
      .tg-bar { transition:none; }
      .tg-pcard.fut .tg-flw svg { animation:none; }
      .tg-gauge .gtrk i { transition:none; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="mx-auto max-w-[1600px] px-6 pt-6 pb-2">
    <h1 class="text-xl font-bold tracking-tight">Taimi – money garden coach</h1>
    <p class="text-sm text-muted-foreground mt-1">A calm Nordic landscape as your money state — the garden IS the interface. Junction 2026 · S-Pankki.</p>

    if (e("d-gs")) e("d-gs").textContent = futPondSub(p, sav);
    if (e("d-stg")) e("d-stg").innerHTML = `${stageGlyph(futStage)}<span>Stage ${futStage} · ${STAGES[futStage - 1]}</span>`;
    if (e("d-chips")) e("d-chips").innerHTML = futChips(p, f, sav, futPondRatio, futStage > stage);
    if (e("d-chnote")) e("d-chnote").hidden = sav > 0;
    if (e("d-bars")) {
      const max = Math.max(sav, 1);
      e("d-bars").innerHTML = MONTHS.map((m, i) => {
        const v = (f ? f.norm : 0) * state.cut / 100 * (i + 1);
        return `<div class="tg-bar-w"><span class="tg-bar-v">${euro(v)}</span><div class="tg-bar${i === 5 ? " hot" : ""}" style="height:${Math.max(3, Math.round(88 * v / max))}px"></div><span class="tg-bar-m">${m}</span></div>`;
      }).join("");
    }
    if (e("d-total")) e("d-total").textContent = `+${euro(sav)}`;
    if (e("d-hours")) e("d-hours").textContent = `= ${hrs(h)} of your work`;
    if (e("d-note")) e("d-note").textContent = sav === 0 ? "Move the slider to see what changes." : sav < 30
      ? `Small change — your ${f ? f.flower.toLowerCase() : "spending"} is already low.`
      : `≈ ${euro((f ? f.norm : 0) * state.cut / 100)}/month stays in your pocket, compounding.`;
  }

  function s_ask(p) {
    const w = weather(p);
    const pondFull = p.pond_target > 0 && p.pond_fill >= p.pond_target;
    const intro = w.kind === "storm"
      ? `Heads-up — rent ~${p.rent_window[0]}–${p.rent_window[1]} Oct won't fit this cycle, but the pond covers it. What would you like to know?`
      : p.left_cycle > 0
        ? `${euro(p.left_cycle)} left until payday — about ${euro(p.safe_today)}/day. Your pond is ${pondFull ? `full at ${euro(p.pond_fill)}` : `at ${euro(p.pond_fill)}`}. What would you like to know?`
        : `Your fun budget is used up for this cycle — the pond is fine though, at ${euro(p.pond_fill)}. What would you like to know?`;
    const msgs = state.chat.length ? state.chat : [{ role:"coach", text:intro, rec:0 }];
    return `<div class="app tg-app">
      <div class="tg-band"><div class="tg-art">${scene(p, { vb:"0 330 390 330" })}</div>${sb}</div>
      <div class="tg-chat" id="tg-thread">
        ${msgs.map((m, i) => m.role === "user"
          ? `<div class="tg-msg me">${m.text}</div>`
          : `<div class="tg-msg"><div class="who">Taimi</div>${m.text}${m.rec ? cvReceipts(p, m.rec, `rc-${i}`) : ""}</div>`).join("")}
      </div>
      <div class="tg-quick">${CV_QUESTIONS.map(([k, q]) => `<button class="tg-q" data-action="quick" data-q="${k}">${q}</button>`).join("")}</div>
      ${tgTabs("home")}
    </div>`;
  }

  function s_widget(p) {
    const w = weather(p);
    const f = flowerBy(p, p.top_flower);
    const st = stageOf(p);
    const storm = variantOf(p) === "storm";
    const wp = `<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="390" height="844" fill="${storm ? "#3C4E66" : "#9FB6BD"}"/>
      ${[-30, 50, 130, 210, 290, 370, 450].map((x, k) => spruce(x, 500, 52 + (k % 3) * 14, storm ? "#2E4159" : "#7E968F")).join("")}
      <rect y="500" width="390" height="344" fill="${storm ? "#4A5C48" : "#8AA07E"}"/>
      ${[-10, 90, 190, 290, 390].map((x, k) => spruce(x, 500, 68 + ((k + 1) % 3) * 16, storm ? "#33445A" : "#6E8A76")).join("")}
      <rect y="500" width="390" height="20" fill="${storm ? "#42546A" : "#93B4C2"}"/>
      <rect y="520" width="390" height="324" fill="${storm ? "#46553F" : "#7E9678"}"/>
    </svg>`;
    const small = `<div class="wgt small"><span class="w-nm">Taimi · ${STAGES[st - 1]}</span>
      <span style="display:flex;align-items:flex-end;gap:10px;margin-top:auto;margin-bottom:auto">
        <svg viewBox="-32 -160 64 166" width="34" height="88" aria-hidden="true">${taimiPlant(st, variantOf(p), 0, 0, 1)}</svg>
        <span><span class="w-num">${w.big}</span><span class="w-sub" style="display:block">${w.sub}</span></span></span></div>`;
    const med = `<div class="wgt med"><div class="tg-art" style="position:absolute;inset:0">${scene(p, { vb:"60 330 390 330" })}</div>
      <div style="position:absolute;left:10px;top:10px;z-index:2;background:rgb(255 255 255/.85);border-radius:12px;padding:7px 10px;max-width:62%"><span class="w-nm">Money garden</span><div class="w-num" style="color:#1F2A24">${w.big}</div>
      <div class="w-sub" style="color:#3E4C42">rent ${euro(p.rent)} ~${p.rent_window[0]}–${p.rent_window[1]} Oct · ${f.flower} ${stateWord(fstate(f))}</div></div></div>`;
    const ic = `<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="4"/></svg>`;
    const icons = `<div class="appico">${ic}</div><div class="appico">${ic}</div><div class="appico">${ic}</div><div class="appico">${ic}</div>`;
    return `<div class="app ios"><div class="wp">${wp}</div>
      <div class="ios-grid">${small}${icons}${med}</div>
      <div class="ios-dock">${ic}${ic}${ic}${ic}</div>
    </div>`;
  }

  /* ================= state, render, events ================= */
  const params = new URLSearchParams(location.search);
  const state = {
    persona: DATA[params.get("persona")] ? params.get("persona") : "CUST04957",
    cat: "Restaurants", cut: 20, chat: []
  };
  const defCat = p => {
    const wilt = p.flowers.filter(f => CATS.includes(f.flower) && fstate(f) === "wilting" && f.norm > 0);
    const pool = wilt.length ? wilt : p.flowers.filter(f => CATS.includes(f.flower) && f.norm > 0);
    if (!pool.length) return "Restaurants";
    return pool.reduce((a, b) => b.norm > a.norm ? b : a).flower;
  };
  state.cat = defCat(DATA[state.persona]);
  const SCREENS = [s_home, s_sheet, s_decide, s_ask, s_widget];
  const CAPS = ["1 · Garden home", "2 · Flower sheet", "3 · You decide", "4 · Ask Taimi", "5 · Widget"];

  document.getElementById("persona-seg").innerHTML = PERSONAS.map(pp =>
    `<button type="button" data-persona="${pp.id}" aria-pressed="${pp.id === state.persona}">${pp.label}</button>`).join("");

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function render() {
    const p = DATA[state.persona];
    for (let i = 0; i < 5; i++) document.getElementById(`scr-${i + 1}`).innerHTML = SCREENS[i](p);
    CAPS.forEach((c, i) => document.getElementById(`cap-${i + 1}`).textContent = c);
    document.getElementById("caption").textContent = `Synthetic S-Pankki dataset · persona ${p.id} · as of 15 Sep 2026 · AI coach text is a sample`;
    document.querySelectorAll("[data-persona]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.persona === state.persona)));
    const q = new URLSearchParams(location.search);
    q.set("persona", state.persona);
    q.set("theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
    history.replaceState(null, "", `${location.pathname}?${q}`);
  }

  document.addEventListener("click", e => {
    const pBtn = e.target.closest("button[data-persona]");
    if (pBtn) { state.persona = pBtn.dataset.persona; state.chat = []; state.cat = defCat(DATA[state.persona]); render(); return; }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const act = el.dataset.action;
    if (act === "toast") toast(el.dataset.msg || "Prototype: not wired up");
    else if (act === "expl") {
      const open = el.getAttribute("aria-expanded") === "true";
      el.setAttribute("aria-expanded", String(!open));
      const target = document.getElementById(el.getAttribute("aria-controls"));
      if (target) target.hidden = open;
    } else if (act === "chip") {
      state.cat = el.dataset.cat;
      el.parentElement.querySelectorAll("[data-cat]").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.cat === state.cat)));
      updateDecide();
    } else if (act === "quick") {
      const p = DATA[state.persona];
      const q = CV_QUESTIONS.find(x => x[0] === el.dataset.q);
      state.chat.push({ role:"user", text:q[1] });
      state.chat.push({ role:"coach", text:cvAnswer(p, el.dataset.q), rec:3 });
      document.getElementById("scr-4").innerHTML = s_ask(p);
      const th = document.getElementById("tg-thread"); if (th) th.scrollTop = th.scrollHeight;
    }
  });
  document.addEventListener("submit", e => e.preventDefault());
  document.addEventListener("input", e => {
    if (e.target.id === "dc-slider") { state.cut = +e.target.value; updateDecide(); }
  });
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const isDark = document.documentElement.classList.toggle("dark");
    localStorage.theme = isDark ? "dark" : "light";
    document.getElementById("theme-label").textContent = isDark ? "Light" : "Dark";
    const q = new URLSearchParams(location.search);
    q.set("theme", isDark ? "dark" : "light");
    history.replaceState(null, "", `${location.pathname}?${q}`);
  });
  document.getElementById("theme-label").textContent = document.documentElement.classList.contains("dark") ? "Light" : "Dark";
  render();
  </script>
</body>
</html>
